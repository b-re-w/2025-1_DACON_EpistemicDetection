[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "epidec"
version = "1.0.0"
description = "🧠 Beyond surface patterns: Detecting AI-generated text through fundamental differences in knowledge acquisition and reasoning"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "b-re-w", email = "brew.airesearch@gmail.com"}
]
maintainers = [
    {name = "b-re-w", email = "brew.airesearch@gmail.com"}
]
keywords = [
    "ai-detection",
    "llm-detection", 
    "epistemology",
    "cognitive-science",
    "rlhf",
    "machine-learning",
    "ai-safety",
    "text-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9,<3.14"
dependencies = [
    # Core ML/AI frameworks
    "torch ; platform_system == 'Windows'",
    "torchvision ; platform_system == 'Windows'",
    "torchaudio ; platform_system == 'Windows'",
    "torch ; platform_system == 'Linux'",
    "torchvision ; platform_system == 'Linux'",
    "transformers>=4.53.0",
    "numpy>=1.21.0",
    "lattent @ git+https://github.com/b-re-w/lattent.git",

    # Data processing
    "pandas>=1.3.0",
    "datasets>=2.10.0",

    # Evaluation and metrics
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    
    # Utilities
    "tqdm>=4.60.0",
    "rich>=12.0.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# Documentation dependencies
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
]

# Jupyter notebook dependencies
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "plotly>=5.0.0",
]

# Korean language specific dependencies
korean = [
    "konlpy>=0.6.0",
    "soynlp>=0.0.493",
    "kiwipiepy>=0.16.0",
    "mecab-python3>=1.0.0",
]

# Advanced ML dependencies
advanced = [
    "accelerate>=0.20.0",
    "deepspeed>=0.9.0",
    "flash-attn>=2.0.0",
    "bitsandbytes>=0.40.0",
]

# All dependencies
all = [
    "epidec[dev,docs,notebooks,korean,advanced]"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-windows", marker = "platform_system == 'Windows'" },
]
torchvision = [
    { index = "pytorch-windows", marker = "platform_system == 'Windows'" },
]
torchaudio = [
    { index = "pytorch-windows", marker = "platform_system == 'Windows'" },
]

[[tool.uv.index]]
name = "pytorch-windows"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.urls]
Homepage = "https://github.com/yourusername/epistemic-detection"
Repository = "https://github.com/yourusername/epistemic-detection"
Documentation = "https://epistemic-detection.readthedocs.io"
"Bug Tracker" = "https://github.com/yourusername/epistemic-detection/issues"
"Changelog" = "https://github.com/yourusername/epistemic-detection/blob/main/CHANGELOG.md"

[project.scripts]
epidec = "epidec.cli:main"
epidec-train = "epidec.training.cli:main"
epidec-eval = "epidec.evaluation.cli:main"
epidec-server = "epidec.api.server:main"

# Flit module configuration
[tool.flit.module]
name = "epidec"

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["epidec"]
known_third_party = [
    "torch",
    "transformers", 
    "numpy",
    "pandas",
    "sklearn",
    "matplotlib",
    "seaborn"
]

# Flake8 configuration
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg",
]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "numpy.*",
    "pandas.*",
    "sklearn.*",
    "matplotlib.*",
    "seaborn.*",
    "konlpy.*",
    "soynlp.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--cov=epidec",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "korean: marks tests specific to Korean language processing",
    "rlhf: marks tests related to RLHF analysis",
    "surprise: marks tests related to surprise metrics",
    "domain: marks tests related to domain analysis",
    "adaptation: marks tests related to adaptation analysis",
]

# Coverage configuration
[tool.coverage.run]
source = ["epidec"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/cli.py",
    "*/server.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Ruff configuration (alternative to flake8)
[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["E501"]

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]
